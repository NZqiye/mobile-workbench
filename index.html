<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#3987ed">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="每日工作台">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <title>每日工作台</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="phone-shell">
    <header class="topbar">
      <div class="status"><strong id="clock">11:13</strong><span>5G Wi-Fi 78</span></div>
      <div class="navline">
        <button class="icon-button" aria-label="首页">⌂</button>
        <h1 id="pageTitle">每日工作台</h1>
        <button class="pill-button" id="exportData" aria-label="导出">导出</button>
      </div>
      <div class="workspace-title">
        <span class="home-mark">⌂</span>
        <strong id="sectionTitle">每日打卡</strong>
        <button class="ghost-button" id="clearPage" aria-label="清空当前页">清空</button>
      </div>
    </header>

    <section class="app-body">
      <aside class="side-nav" aria-label="工作台导航">
        <button class="nav-item active" data-page="checkin"><span>✅</span><small>每日打卡</small></button>
        <button class="nav-item" data-page="food"><span>🥗</span><small>饮食记录</small></button>
        <button class="nav-item" data-page="news"><span>📰</span><small>每日新闻</small></button>
        <button class="nav-item" data-page="review"><span>📝</span><small>每日复盘</small></button>
        <button class="nav-item" data-page="chat"><span>🤖</span><small>AI chat</small></button>
        <button class="nav-item" data-page="money"><span>💰</span><small>记账日记</small></button>
        <button class="nav-item" data-page="stats"><span>📊</span><small>统计</small></button>
      </aside>

      <section class="content">
        <div class="cloud-status" id="cloudStatus">云端同步准备中...</div>
        <section class="page active" data-view="checkin">
          <article class="card">
            <div class="card-heading"><h2>今日打卡</h2><span class="tag">今天</span></div>
            <label class="check-row"><input type="checkbox" data-save="checkin-water"><span>喝水 8 杯</span></label>
            <label class="check-row"><input type="checkbox" data-save="checkin-workout"><span>运动或拉伸 30 分钟</span></label>
            <label class="check-row"><input type="checkbox" data-save="checkin-reading"><span>阅读 / 学习 20 分钟</span></label>
            <label class="check-row"><input type="checkbox" data-save="checkin-review"><span>完成晚间复盘</span></label>
          </article>
          <article class="card">
            <h2>自定义打卡</h2>
            <form class="quick-form" data-form="checkin">
              <input name="title" type="text" placeholder="例如：早睡、背单词、看盘复盘" required>
              <button type="submit">添加</button>
            </form>
            <div class="record-list" data-list="checkin"></div>
          </article>
        </section>

        <section class="page" data-view="food">
          <article class="card">
            <h2>饮食记录</h2>
            <form class="stack-form" data-form="food">
              <select name="meal" required>
                <option value="早餐">早餐</option>
                <option value="午餐">午餐</option>
                <option value="晚餐">晚餐</option>
                <option value="加餐">加餐</option>
              </select>
              <input name="title" type="text" placeholder="吃了什么" required>
              <input name="meta" type="text" placeholder="热量 / 份量，可选">
              <textarea name="note" rows="3" placeholder="备注：口味、饱腹感、是否超标"></textarea>
              <button type="submit">保存饮食</button>
            </form>
          </article>
          <article class="card"><h2>今日饮食列表</h2><div class="record-list" data-list="food"></div></article>
        </section>

        <section class="page" data-view="news">
          <article class="card">
            <h2>每日新闻</h2>
            <form class="stack-form" data-form="news">
              <input name="title" type="text" placeholder="新闻标题 / 主题" required>
              <input name="meta" type="text" placeholder="来源 / 链接，可选">
              <textarea name="note" rows="4" placeholder="核心内容、影响、你的判断"></textarea>
              <button type="submit">保存新闻</button>
            </form>
          </article>
          <article class="card"><h2>新闻记录</h2><div class="record-list" data-list="news"></div></article>
        </section>

        <section class="page" data-view="review">
          <article class="card">
            <h2>每日复盘</h2>
            <form class="stack-form" data-form="review">
              <input name="title" type="text" placeholder="今天最重要的结论" required>
              <textarea name="note" rows="5" placeholder="完成了什么？哪里卡住？明天第一件事是什么？"></textarea>
              <button type="submit">保存复盘</button>
            </form>
          </article>
          <article class="card"><h2>复盘历史</h2><div class="record-list" data-list="review"></div></article>
        </section>

        <section class="page" data-view="chat">
          <article class="card">
            <h2>AI chat</h2>
            <form class="stack-form" data-form="chat">
              <input name="title" type="text" placeholder="问题 / 主题" required>
              <textarea name="note" rows="5" placeholder="把想问 AI 的问题、回答摘要或提示词记在这里"></textarea>
              <button type="submit">保存对话</button>
            </form>
          </article>
          <article class="card"><h2>对话记录</h2><div class="record-list" data-list="chat"></div></article>
        </section>

        <section class="page" data-view="stats">
          <article class="stats-hero">
            <div class="stats-hero-top">
              <button type="button" class="stats-menu">☰</button>
              <strong id="statsMonth">2026-07</strong>
              <span>📊</span>
            </div>
            <div class="stats-main-number">
              <span>月消费</span>
              <strong id="statsExpense">0.00</strong>
            </div>
            <div class="stats-summary-row">
              <span>月收入 <b id="statsIncome">0.00</b></span>
              <span>本月结余 <b id="statsBalance">0.00</b></span>
            </div>
          </article>

          <article class="card stats-card">
            <div class="stats-card-head">
              <div><h2>最近15日消费</h2><p id="stats15Total">总计：0.00</p></div>
              <span>•••</span>
            </div>
            <div class="bar-chart" id="statsBarChart"></div>
          </article>

          <section class="stats-day-list" id="statsDayList"></section>
        </section>
        <section class="page" data-view="money">
          <article class="money-panel">
            <div class="money-tabs" role="tablist" aria-label="记账类型">
              <button class="money-tab active" type="button" data-money-kind="消费">消费</button>
              <button class="money-tab" type="button" data-money-kind="收入">收入</button>
            </div>

            <div class="money-category-grid" id="moneyCategoryGrid"></div>

            <div class="money-entry">
              <input id="moneyNote" type="text" placeholder="点此输入备注..." autocomplete="off">
              <output id="moneyAmount" class="money-amount">0.0</output>
            </div>

            <div class="money-chips">
              <button type="button">账户</button>
              <button type="button">今天</button>
              <button type="button">图片</button>
              <button type="button">⚑</button>
            </div>

            <div class="money-keypad" id="moneyKeypad">
              <button type="button" data-key="1">1</button>
              <button type="button" data-key="2">2</button>
              <button type="button" data-key="3">3</button>
              <button type="button" data-key="back">⌫</button>
              <button type="button" data-key="4">4</button>
              <button type="button" data-key="5">5</button>
              <button type="button" data-key="6">6</button>
              <button type="button" data-key="minus">-</button>
              <button type="button" data-key="7">7</button>
              <button type="button" data-key="8">8</button>
              <button type="button" data-key="9">9</button>
              <button type="button" data-key="plus">+</button>
              <button type="button" data-key="again">再记</button>
              <button type="button" data-key="0">0</button>
              <button type="button" data-key=".">.</button>
              <button class="money-save" type="button" id="moneySave">保存</button>
            </div>
          </article>

          <article class="card">
            <h2>账目记录</h2>
            <div class="money-total" id="moneyTotal">合计：0</div>
            <div class="record-list" data-list="money"></div>
          </article>
        </section>
      </section>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
