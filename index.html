<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#3987ed">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="七夜的工作台">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <title>七夜的工作台</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="phone-shell">
    <header class="topbar">
      <div class="status"><strong id="clock">11:13</strong><span>5G Wi-Fi 78</span></div>
      <div class="navline">
        <button class="icon-button" aria-label="首页">⌂</button>
        <h1 id="pageTitle">七夜的工作台</h1>
        <button class="pill-button" id="exportData" aria-label="导出">导出</button>
      </div>
      <div class="workspace-title">
        <span class="home-mark">✦</span>
        <strong id="sectionTitle">习惯打卡</strong>
        <button class="ghost-button" id="clearPage" aria-label="清空当前页">清空</button>
      </div>
    </header>

    <section class="app-body">
      <aside class="side-nav" aria-label="工作台导航">
        <div class="nav-group-title">娱乐</div>
        <button class="nav-item" data-page="media"><span>🎬</span><small>影视推荐</small></button>
        <button class="nav-item" data-page="chat"><span>🤖</span><small>AI chat</small></button>

        <div class="nav-group-title">生活</div>
        <button class="nav-item active" data-page="checkin"><span>🌱</span><small>习惯打卡</small></button>
        <button class="nav-item" data-page="food"><span>🥗</span><small>饮食记录</small></button>
        <button class="nav-item" data-page="todo"><span>✅</span><small>待办清单</small></button>
        <button class="nav-item" data-page="sleep"><span>🌙</span><small>作息提醒</small></button>
        <button class="nav-item" data-page="treehole"><span>💙</span><small>七夜树洞</small></button>
        <button class="nav-item" data-page="review"><span>📝</span><small>每日复盘</small></button>
        <button class="nav-item" data-page="settings"><span>⚙️</span><small>设置</small></button>
      </aside>

      <section class="content">
        <div class="cloud-status" id="cloudStatus">云端同步准备中...</div>

        <section class="page active" data-view="checkin">
          <article class="hero-card">
            <span>🌱</span>
            <div><h2>习惯打卡</h2><p>坚持就是胜利，今天也给自己一点确定感。</p></div>
          </article>
          <article class="card">
            <div class="card-heading"><h2>今日打卡任务</h2><span class="tag" id="checkinToday">今天</span></div>
            <div class="checkin-task-list" id="checkinTaskList"></div>
          </article>
          <article class="card">
            <h2>添加自定义打卡</h2>
            <form class="quick-form" id="checkinTaskForm">
              <input id="checkinTaskInput" type="text" placeholder="例如：早睡、运动、读书、复盘" required>
              <button type="submit">添加</button>
            </form>
          </article>
        </section>

        <section class="page" data-view="media">
          <article class="card">
            <h2>影视推荐</h2>
            <form class="stack-form" data-form="media">
              <input name="title" type="text" placeholder="片名 / 剧名 / 综艺名" required>
              <input name="meta" type="text" placeholder="平台 / 类型 / 链接，可选">
              <textarea name="note" rows="4" placeholder="推荐理由、看点、适合什么时候看"></textarea>
              <button type="submit">保存推荐</button>
            </form>
          </article>
          <article class="card"><h2>推荐记录</h2><div class="record-list" data-list="media"></div></article>
        </section>

        <section class="page" data-view="chat">
          <article class="card">
            <h2>AI chat</h2>
            <form class="stack-form" data-form="chat">
              <input name="title" type="text" placeholder="问题 / 主题" required>
              <textarea name="note" rows="5" placeholder="把想问 AI 的问题、回答摘要或提示词记在这里"></textarea>
              <button type="submit">保存对话</button>
            </form>
          </article>
          <article class="card"><h2>对话记录</h2><div class="record-list" data-list="chat"></div></article>
        </section>

        <section class="page" data-view="food">
          <article class="card">
            <h2>饮食记录</h2>
            <form class="stack-form" data-form="food">
              <select name="meal" required>
                <option value="早餐">早餐</option>
                <option value="午餐">午餐</option>
                <option value="晚餐">晚餐</option>
                <option value="加餐">加餐</option>
              </select>
              <input name="title" type="text" placeholder="吃了什么" required>
              <input name="meta" type="text" placeholder="热量 / 份量，可选">
              <textarea name="note" rows="3" placeholder="备注：口味、饱腹感、是否超标"></textarea>
              <button type="submit">保存饮食</button>
            </form>
          </article>
          <article class="card"><h2>饮食列表</h2><div class="record-list" data-list="food"></div></article>
        </section>

        <section class="page" data-view="todo">
          <article class="card">
            <h2>我的待办清单</h2>
            <form class="stack-form" data-form="todo">
              <input name="title" type="text" placeholder="事件名称" required>
              <select name="meal">
                <option value="今天">今天</option>
                <option value="本周">本周</option>
                <option value="以后">以后</option>
              </select>
              <textarea name="note" rows="3" placeholder="补充说明、地点、需要准备什么"></textarea>
              <button type="submit">添加待办</button>
            </form>
          </article>
          <article class="card"><h2>待办记录</h2><div class="record-list" data-list="todo"></div></article>
        </section>

        <section class="page" data-view="sleep">
          <article class="card">
            <h2>早睡早起提醒</h2>
            <div class="reminder-list">
              <label class="reminder-row"><span>🌙 睡觉提醒</span><input id="sleepTime" type="time" value="23:00"></label>
              <label class="reminder-row"><span>☀️ 起床提醒</span><input id="wakeTime" type="time" value="07:00"></label>
              <label class="toggle-row"><span>启用提醒记录</span><input id="sleepToggle" type="checkbox"></label>
            </div>
            <button class="full-button" id="saveSleepSettings" type="button">保存作息设置</button>
          </article>
          <article class="card"><h2>作息记录</h2><div class="record-list" data-list="sleep"></div></article>
        </section>

        <section class="page" data-view="treehole">
          <article class="card">
            <h2>七夜树洞</h2>
            <form class="stack-form" data-form="treehole">
              <input name="title" type="text" placeholder="今天的小标题" required>
              <textarea name="note" rows="6" placeholder="今天的小想法、小情绪、小确幸……都放进来吧"></textarea>
              <button type="submit">存进树洞</button>
            </form>
          </article>
          <article class="card"><h2>树洞记录</h2><div class="record-list" data-list="treehole"></div></article>
        </section>

        <section class="page" data-view="review">
          <article class="card">
            <h2>每日复盘</h2>
            <form class="stack-form" data-form="review">
              <input name="title" type="text" placeholder="今天最重要的结论" required>
              <textarea name="note" rows="5" placeholder="完成了什么？哪里卡住？明天第一件事是什么？"></textarea>
              <button type="submit">保存复盘</button>
            </form>
          </article>
          <article class="card"><h2>复盘历史</h2><div class="record-list" data-list="review"></div></article>
        </section>

        <section class="page" data-view="settings">
          <article class="card">
            <h2>主题颜色</h2>
            <div class="theme-grid" id="themeGrid">
              <button type="button" data-theme="#3987ed" data-soft="#dcebff"><span style="background:#3987ed"></span>蓝色</button>
              <button type="button" data-theme="#22a06b" data-soft="#dcfce7"><span style="background:#22a06b"></span>绿色</button>
              <button type="button" data-theme="#a855f7" data-soft="#f0e7ff"><span style="background:#a855f7"></span>紫色</button>
              <button type="button" data-theme="#e45858" data-soft="#ffe4e1"><span style="background:#e45858"></span>红色</button>
            </div>
          </article>
        </section>
      </section>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
